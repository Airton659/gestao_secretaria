services:

  # ── API .NET 9 (dotnet watch) ─────────────────────────────────────────────
  secretaria-api:
    build:
      context: .
      dockerfile: Dockerfile.api.dev
    container_name: secretaria-api-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/bin
      - /app/obj
    ports:
      - "5001:8080"
    env_file: .env.dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - TZ=America/Sao_Paulo
    restart: unless-stopped

  # ── Frontend React + Vite (HMR) ───────────────────────────────────────────
  secretaria-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: secretaria-frontend-dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - API_URL=http://secretaria-api:8080
    depends_on:
      - secretaria-api
    restart: unless-stopped
