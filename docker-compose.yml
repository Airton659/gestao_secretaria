services:

  secretaria-api:
    image: ghcr.io/airton659/secretaria-api:latest
    container_name: secretaria-api
    ports:
      - "${API_PORT}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=America/Sao_Paulo
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ConnectionStrings__CorpConnection=${CORP_CONNECTION_STRING}
      - Keycloak__Authority=${KEYCLOAK_AUTHORITY}
      - Keycloak__MetadataAddress=${KEYCLOAK_METADATA_ADDRESS}
      - Keycloak__AdminClientSecret=${Keycloak__AdminClientSecret}
    networks:
      - default
      - keycloak_default
    restart: unless-stopped

  secretaria-frontend:
    image: ghcr.io/airton659/secretaria-frontend:latest
    container_name: secretaria-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - secretaria-api
    restart: unless-stopped

networks:
  keycloak_default:
    external: true
