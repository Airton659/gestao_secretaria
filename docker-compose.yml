services:

  secretaria-api:
    image: ghcr.io/airton659/secretaria-api:latest
    container_name: secretaria-api
    ports:
      - "8084:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=America/Sao_Paulo
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Keycloak__Authority=${Keycloak__Authority:-http://192.168.0.23:8082/realms/funcesi-sso}
      - Keycloak__MetadataAddress=${Keycloak__MetadataAddress:-http://keycloak-server:8080/realms/funcesi-sso/.well-known/openid-configuration}
      - Keycloak__AdminClientSecret=${Keycloak__AdminClientSecret}
    networks:
      - default
      - keycloak_default
    restart: unless-stopped

  secretaria-frontend:
    image: ghcr.io/airton659/secretaria-frontend:latest
    container_name: secretaria-frontend
    ports:
      - "8005:80"
    depends_on:
      - secretaria-api
    restart: unless-stopped

networks:
  keycloak_default:
    external: true
